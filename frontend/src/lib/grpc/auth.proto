syntax = "proto3";

package auth.v1;

// Use module import path with package alias for Go codegen
option go_package = "./proto/auth/v1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service AuthService {
  // Health
  // Returns service health and optional details
  rpc HealthCheck(google.protobuf.Empty) returns (HealthCheckResponse);

  // User management
  // Registers a new user under a client
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);
  // Changes the password for the authenticated user (requires access_token)
  rpc ChangeUserPassword(ChangeUserPasswordRequest) returns (ChangeUserPasswordResponse);
  // Updates the username and/or email for the authenticated user (requires access_token)
  rpc UpdateUserProfile(UpdateUserProfileRequest) returns (UpdateUserProfileResponse);

  // Client management
  // Registers a new client and returns its credentials
  rpc RegisterClient(RegisterClientRequest) returns (RegisterClientResponse);
  // Rotates a client's secret after validating the current one
  rpc ChangeClientSecret(ChangeClientSecretRequest) returns (ChangeClientSecretResponse);
  // Validates a client's ID and secret for App Admin login
  rpc ValidateClientCredentials(ValidateClientCredentialsRequest) returns (ValidateClientCredentialsResponse);

  // Token management
  // Issues access and refresh tokens for a user (aka login)
  rpc GetToken(GetTokenRequest) returns (GetTokenResponse);
  // Exchanges a refresh token for a new access token (and refresh token)
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  // Revokes a refresh token (logout)
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);
  // Validates an access token and returns profile info
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  // Lists all registered clients (Super Admin only)
  rpc ListClients(google.protobuf.Empty) returns (ListClientsResponse);
  // Returns global system statistics (Super Admin only)
  rpc GetSystemStats(google.protobuf.Empty) returns (GetSystemStatsResponse);

  // Lists users for a specific client
  rpc ListClientUsers(ListClientUsersRequest) returns (ListClientUsersResponse);
  // Returns stats for a specific client
  rpc GetClientStats(GetClientStatsRequest) returns (GetClientStatsResponse);
  // Creates a user bypassing normal registration checks (Client Admin only)
  rpc CreateClientUser(CreateClientUserRequest) returns (CreateClientUserResponse);
  // Deletes a user within a client (Client Admin only)
  rpc DeleteClientUser(DeleteClientUserRequest) returns (google.protobuf.Empty);
  // Updates a user's profile within a client (Client Admin only)
  rpc UpdateClientUser(UpdateClientUserRequest) returns (UpdateClientUserResponse);

  // Invite Tokens
  // Creates an invite token for a client (Client Admin only)
  rpc CreateInviteToken(CreateInviteTokenRequest) returns (CreateInviteTokenResponse);

  // Client Configuration
  // Gets configuration for a specific client
  rpc GetClientConfig(GetClientConfigRequest) returns (GetClientConfigResponse);
  // Updates configuration for a specific client
  rpc UpdateClientConfig(UpdateClientConfigRequest) returns (UpdateClientConfigResponse);

  // Password Reset
  // Requests a password reset token for an email
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  // Resets the password using a valid reset token
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);

  // Session Management
  // Revokes all sessions for the authenticated user (except current)
  rpc RevokeAllSessions(RevokeAllSessionsRequest) returns (RevokeAllSessionsResponse);
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  ServingStatus status = 1;
  string message = 2;
  map<string, string> details = 3;
}

// User Models
message UserProfile {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string client_id = 4;
  google.protobuf.Timestamp created_at = 5;
}

// Request/Response Definitions
message RegisterUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string client_id = 4;
  string invite_token = 5; // optional, required for invite-only clients
}

message RegisterUserResponse {
  bool success = 1;
  string message = 2;
  string user_id = 3;
}

message ChangeUserPasswordRequest {
  string access_token = 1;
  string current_password = 2;
  string new_password = 3;
}

message ChangeUserPasswordResponse {
  bool success = 1;
  string message = 2;
}

message UpdateUserProfileRequest {
  string access_token = 1;
  string new_username = 2; // optional, leave empty to not update
  string new_email = 3;    // optional, leave empty to not update
}

message UpdateUserProfileResponse {
  bool success = 1;
  string message = 2;
  UserProfile user = 3; // The updated user profile
}

message GetTokenRequest {
  string login_identifier = 1; // required (username or email)
  string password = 2;         // required
  string client_id = 3;        // required
  string user_agent = 4;       // optional
}

message GetTokenResponse {
  bool success = 1;
  string message = 2;
  string access_token = 3;
  string refresh_token = 4;
  google.protobuf.Timestamp expires_at = 5;
  UserProfile user = 6;
}

message RefreshTokenRequest {
  string refresh_token = 1; // required
  string client_id = 2;     // required
}

message RefreshTokenResponse {
  bool success = 1;
  string message = 2;
  string access_token = 3;
  string refresh_token = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message RevokeTokenRequest {
  string refresh_token = 1;
}

message RevokeTokenResponse {
  bool success = 1;
  string message = 2;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string message = 2;
  string user_id = 3;
  google.protobuf.Timestamp expires_at = 4;
  // Full user profile returned for convenience
  UserProfile user = 5;
}

message RegisterClientRequest {
  string client_name = 1;
}

message RegisterClientResponse {
  bool success = 1;
  string message = 2;
  string client_id = 3;
  string client_secret = 4; // returned only on registration
}

message ChangeClientSecretRequest {
  string client_id = 1;
  string current_secret = 2;
  string new_secret = 3; // optional, if empty, one will be generated
}

message ChangeClientSecretResponse {
  bool success = 1;
  string message = 2;
  string client_id = 3;
  string client_secret = 4; // returned when rotated/generated
}

message ValidateClientCredentialsRequest {
    string client_id = 1;
    string client_secret = 2;
}

message ValidateClientCredentialsResponse {
    bool valid = 1;
    string message = 2;
    string client_name = 3;
}
message ListClientsResponse {
    repeated ClientInfo clients = 1;
}

message ClientInfo {
    string client_id = 1;
    string client_name = 2;
    google.protobuf.Timestamp created_at = 3;
}


message GetSystemStatsResponse {
    int64 total_users = 1;
    int64 total_clients = 2;
    int64 active_sessions = 3;
    double system_health = 4; // 0.0 to 1.0
}

message ListClientUsersRequest {
    string client_id = 1;
}

message ListClientUsersResponse {
    repeated UserProfile users = 1;
}

message GetClientStatsRequest {
    string client_id = 1;
}

message GetClientStatsResponse {
    int64 total_users = 1;
    int64 last_24h_logins = 2;
}

message CreateClientUserRequest {
    string client_id = 1;
    string username = 2;
    string email = 3;
    string password = 4;
}

message CreateClientUserResponse {
    bool success = 1;
    string message = 2;
    UserProfile user = 3;
}

message DeleteClientUserRequest {
    string client_id = 1;
    string user_id = 2;
}

message UpdateClientUserRequest {
    string client_id = 1;
    string user_id = 2;
    string new_username = 3;
    string new_email = 4;
    string new_password = 5;
}

message UpdateClientUserResponse {
    bool success = 1;
    string message = 2;
}

message ClientConfig {
    bool demo_mode = 1;
    bool invite_only = 2;
    string login_type = 3;
}

message GetClientConfigRequest {
    string client_id = 1;
}

message GetClientConfigResponse {
    bool success = 1;
    string message = 2;
    ClientConfig config = 3;
}

message UpdateClientConfigRequest {
    string client_id = 1;
    ClientConfig config = 2;
}

message UpdateClientConfigResponse {
    bool success = 1;
    string message = 2;
    ClientConfig config = 3;
}

// Invite Tokens
message CreateInviteTokenRequest {
    string client_id = 1;
    string email = 2; // optional, pre-fill email for the invitee
}

message CreateInviteTokenResponse {
    bool success = 1;
    string message = 2;
    string invite_token = 3;
}

// Password Reset
message RequestPasswordResetRequest {
    string email = 1;
    string client_id = 2;
}

message RequestPasswordResetResponse {
    bool success = 1;
    string message = 2;
    string reset_token = 3; // In production, this would be sent via email, not returned directly
}

message ResetPasswordRequest {
    string reset_token = 1;
    string new_password = 2;
}

message ResetPasswordResponse {
    bool success = 1;
    string message = 2;
}

// Session Management
message RevokeAllSessionsRequest {
    string access_token = 1;
}

message RevokeAllSessionsResponse {
    bool success = 1;
    string message = 2;
    int64 revoked_count = 3;
}
