syntax = "proto3";

package auth.v1;

// Use module import path with package alias for Go codegen
option go_package = "./proto/auth/v1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service AuthService {
  // Health
  // Returns service health and optional details
  rpc HealthCheck(google.protobuf.Empty) returns (HealthCheckResponse);

  // User management
  // Registers a new user under a client (requires client credentials)
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);
  // Changes the password for the authenticated user (requires access_token
  // and client credentials); invalidates all other sessions
  rpc ChangeUserPassword(ChangeUserPasswordRequest) returns (ChangeUserPasswordResponse);

  // Client management (gated by ADMIN_SECRET)
  // Registers a new client and returns its credentials (secret shown once)
  rpc RegisterClient(RegisterClientRequest) returns (RegisterClientResponse);
  // Rotates a client's secret after validating the current one
  rpc ChangeClientSecret(ChangeClientSecretRequest) returns (ChangeClientSecretResponse);

  // Token management (all require client credentials)
  // Issues access and refresh tokens for a user (aka login)
  rpc GetToken(GetTokenRequest) returns (GetTokenResponse);
  // Exchanges a refresh token for a new access token (and rotated refresh token)
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  // Revokes a refresh token (logout of a single session)
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);
  // Validates an access token (revocation-aware) and returns profile info
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);

  // Session management (all require client credentials + access_token)
  // Logs the user out of every session under this client
  rpc LogoutAllSessions(LogoutAllSessionsRequest) returns (LogoutAllSessionsResponse);
  // Lists the user's active sessions under this client
  rpc GetUserSessions(GetUserSessionsRequest) returns (GetUserSessionsResponse);
  // Revokes one of the user's sessions by session_id
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
}

message HealthCheckResponse {
    enum Status {
        SERVING = 0;
        NOT_SERVING = 1;
        SERVICE_UNKNOWN = 2;
    }
    Status status = 1;
    string message = 2;
    map<string, string> details = 3;
}

message RegisterUserRequest {
    string username = 1;
    string email = 2;
    string password = 3;
    string client_id = 4;
    string client_secret = 5; // required
}

message RegisterUserResponse {
    bool success = 1;
    string message = 2;
    string user_id = 3;
}

// Token issuance (login)
message GetTokenRequest {
  string email = 1;         // required
  string password = 2;      // required
  string client_id = 3;     // required
  string user_agent = 4;    // optional
  string client_secret = 5; // required
}

message GetTokenResponse {
  bool success = 1;
  string message = 2;
  string access_token = 3;
  string refresh_token = 4;
  google.protobuf.Timestamp expires_at = 5;
  UserProfile user = 6;
  string session_id = 7;
}

message ValidateTokenRequest {
    string access_token = 1;
    string client_id = 2;     // required
    string client_secret = 3; // required
}

message ValidateTokenResponse {
    bool valid = 1;
    string message = 2;
    string user_id = 3;
    google.protobuf.Timestamp expires_at = 4;
    // Full user profile returned for convenience
    UserProfile user = 5;
    string session_id = 6;
}

message RefreshTokenRequest {
    string refresh_token = 1;
    string client_id = 2;
    string client_secret = 3; // required
}

message RefreshTokenResponse {
    bool success = 1;
    string message = 2;
    string access_token = 3;
    string refresh_token = 4;
    google.protobuf.Timestamp expires_at = 5;
}

// Token revoke (logout of a single session)
message RevokeTokenRequest {
  string refresh_token = 1; // required
  string client_id = 2;     // required
  string client_secret = 3; // required
}

message RevokeTokenResponse {
  bool success = 1;
  string message = 2;
}

message RegisterClientRequest {
    string client_name = 1;
    string admin_secret = 2; // required; must match ADMIN_SECRET env var
}

message RegisterClientResponse {
    bool success = 1;
    string message = 2;
    string client_id = 3;
    string client_secret = 4; // shown once; only a bcrypt hash is stored
}

message ChangeUserPasswordRequest {
    string access_token = 1;
    string current_password = 2;
    string new_password = 3;
    string client_id = 4;     // required
    string client_secret = 5; // required
}

message ChangeUserPasswordResponse {
    bool success = 1;
    string message = 2;
}

message UserProfile {
    string user_id = 1;
    string username = 2;
    string email = 3;
    string client_id = 4;
    google.protobuf.Timestamp created_at = 5;
}

// Client secret change
message ChangeClientSecretRequest {
    string client_id = 1;
    string current_secret = 2;
    string new_secret = 3;   // if empty, server may generate a new one
    string admin_secret = 4; // required; must match ADMIN_SECRET env var
}

message ChangeClientSecretResponse {
    bool success = 1;
    string message = 2;
    string client_id = 3;
    string client_secret = 4; // returned when rotated/generated; shown once
}

// Session management
message SessionInfo {
    string session_id = 1;
    string user_agent = 2;
    google.protobuf.Timestamp created_at = 3;
    google.protobuf.Timestamp expires_at = 4;
    bool current = 5; // true for the session the presented access token belongs to
}

message LogoutAllSessionsRequest {
    string access_token = 1;
    string client_id = 2;
    string client_secret = 3;
}

message LogoutAllSessionsResponse {
    bool success = 1;
    string message = 2;
    int32 revoked_count = 3;
}

message GetUserSessionsRequest {
    string access_token = 1;
    string client_id = 2;
    string client_secret = 3;
}

message GetUserSessionsResponse {
    bool success = 1;
    string message = 2;
    repeated SessionInfo sessions = 3;
}

message RevokeSessionRequest {
    string access_token = 1;
    string client_id = 2;
    string client_secret = 3;
    string session_id = 4; // session to revoke; must belong to the token's user
}

message RevokeSessionResponse {
    bool success = 1;
    string message = 2;
}
